name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  product:
    name: Product and lifecycle (official HA pins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify official dependency pins
        run: |
          python -m pip check
          python - <<'PY'
          import importlib.metadata as m
          import platform
          import sys
          print(platform.platform(), sys.version)
          expected = {'homeassistant': '2026.10.1', 'pyintelliclima': '0.5.0', 'orjson': '3.11.9'}
          actual = {name: m.version(name) for name in expected}
          print(actual)
          assert actual == expected
          PY
      - name: Product suite including setup/poll/unload
        run: python -X faulthandler -m pytest -q --tb=short -p no:cacheprovider --ignore=tests/test_native_shutdown.py --junitxml=product-results.xml
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q custom_components scripts tests
      - run: python -m pip check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-results
          path: product-results.xml
  native-diagnostic:
    name: Upstream native diagnostic (failure remains visible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Baseline without custom component or project fixtures
        run: |
          mkdir "$RUNNER_TEMP/native-baseline"
          cp tests/test_native_shutdown.py "$RUNNER_TEMP/native-baseline/"
          cd "$RUNNER_TEMP/native-baseline"
          python - <<'PY'
          import importlib.util
          import importlib.metadata as m
          assert importlib.util.find_spec('custom_components') is None
          assert m.version('orjson') == '3.11.9'
          print('Baseline: custom_components absent; orjson 3.11.9')
          PY
          python -X faulthandler -m pytest -q --tb=short -p no:cacheprovider --junitxml="$GITHUB_WORKSPACE/native-baseline.xml" test_native_shutdown.py
      - name: Identical diagnostic with component checkout and HA fixtures
        if: always()
        run: python -X faulthandler -m pytest -q --tb=short -p no:cacheprovider --junitxml=native-component.xml tests/test_native_shutdown.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-diagnostics-unmodified-assertions
          path: native-*.xml
